[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "thimiko"
version = "0.1.2"
description = "Searchable memory over local AI coding chat histories"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Aster" }]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pytest-benchmark>=4"]
profile = ["scalene>=1.5", "py-spy>=0.3"]

[project.scripts]
thimiko = "thimiko.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
no_implicit_optional = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = ["ANN401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
